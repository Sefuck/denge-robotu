# simetrik_y = true ise bileşen ±y'de birer adet olmak üzere iki tanedir.
# -----------------------------------------------------------------------------
[govde.motor]
aciklama = "Redüktörlü DC motor + enkoder (stator gövdeye bağlı), 2 adet"
simetrik_y = true

[govde.motor.kutle]
deger = 0.15
birim = "kg"
aralik = [0.08, 0.20]
durum = "tahmini"
kaynak = "Mühendislik tahmini: 25–37 mm gövdeli, enkoderli redüktörlü DC motorların tipik kütle aralığı (adet başına)."
sorumlu = "Mete Özgen"

[govde.motor.konum]
deger = [0.0, 0.055, 0.0]
birim = "m"
durum = "tahmini"
kaynak = "Tahmini yerleşim: motor mili teker aksıyla eş eksenli (z = 0), gövde tekerin iç tarafında."

[govde.motor.boyut]
deger = [0.037, 0.070, 0.037]
birim = "m"
durum = "tahmini"
kaynak = "Tahmini motor zarfı: Ø37 × 70 mm sınıfı."

[govde.sasi]
