# =============================================================================
# İki Tekerlekli Ev İçi Hasta Destek Robotu: Modül A & E parametre dosyası
# Hazırlayan: Sefa Nurali Uçak (23015008), 3. hafta, 18 Ekim 2026
#
# DURUM: Motor, teker ve batarya henüz alınmadı; hiçbir fiziksel parametre ölçülmedi.
# Sürüm 0.3: motor tipi parametre oldu (dosyanın sonu); tahrik.tip = "dc" iken hesaplar 0.2 ile aynı.
# Sürüm 0.2: Ön malzeme listesi, cdtp-robot.netlify.app'teki referans malzeme listesinden derlendi; Mete'nin seçimiyle kesinleşecek.
# Motor veri sayfası değerleri rcdrone referans tablosundan alındı. Listede olmayanlar tahmini.
#
# Her parametre aynı alanları taşır:
#   deger   : sayısal değer (SI birim)
#   birim   : birim
#   durum   : "tahmini" | "ön liste" | "doğrulanamadı" | "ölçülmüş" | "şartname" | "öneri" | "sabit"
#             ön liste = ön malzeme listesi (cdtp-robot.netlify.app referans listesinden; Mete'nin seçimiyle kesinleşecek)
#             doğrulanamadı = satıcı referans tablosu, ürünle eşleştiği doğrulanamadı
#   kaynak  : değerin dayanağı
#   aralik  : (isteğe bağlı) makul alt/üst sınır, duyarlılık analizinde kullanılır
#   sorumlu : (isteğe bağlı) ölçülmüş değeri kimin vereceği
#
# Parça gelince: deger'i ölçülmüş değerle değiştir, durum = "ölçülmüş" yap,
# kaynak'a ölçüm yöntemini yaz, sonra `python -m denge` ile dokümanı yeniden üret.
#
# Koordinatlar: orijin teker aksının orta noktası; x ileri, y sol,
# z gövde ekseni boyunca yukarı (gövde dikken, θ = 0).
# =============================================================================

[meta]
surum = "0.3"
tarih = "2026-11-06"
hazirlayan = "Sefa Nurali Uçak (23015008)"

[sabit.g]
deger = 9.80665
birim = "m/s^2"
durum = "sabit"
kaynak = "Standart yerçekimi ivmesi"

