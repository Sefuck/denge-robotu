# =============================================================================
# İki Tekerlekli Ev İçi Hasta Destek Robotu: Modül A & E parametre dosyası
# Hazırlayan: Sefa Nurali Uçak (23015008), 3. hafta, 18 Ekim 2026
#
# DURUM: Motor, teker ve batarya henüz alınmadı. Bu yüzden robotun bütün
# FİZİKSEL parametreleri "tahmini"dir. Hiçbiri ölçülmedi.
#
# Her parametre aynı alanları taşır:
#   deger   : sayısal değer (SI birim)
#   birim   : birim
#   durum   : "tahmini" | "ölçülmüş" | "şartname" | "öneri" | "sabit"
#   kaynak  : değerin dayanağı
#   aralik  : (isteğe bağlı) makul alt/üst sınır, duyarlılık analizinde kullanılır
#   sorumlu : (isteğe bağlı) ölçülmüş değeri kimin vereceği
#
# Parça gelince: deger'i ölçülmüş değerle değiştir, durum = "ölçülmüş" yap,
# kaynak'a ölçüm yöntemini yaz, sonra `python -m denge` ile dokümanı yeniden üret.
#
# Koordinatlar: orijin teker aksının orta noktası; x ileri, y sol,
# z gövde ekseni boyunca yukarı (gövde dikken, θ = 0).
# =============================================================================

[meta]
surum = "0.1"
tarih = "2026-10-18"
hazirlayan = "Sefa Nurali Uçak (23015008)"

[sabit.g]
deger = 9.80665
birim = "m/s^2"
durum = "sabit"
kaynak = "Standart yerçekimi ivmesi"

# -----------------------------------------------------------------------------
# Tekerler (henüz alınmadı)
# -----------------------------------------------------------------------------
[teker.yaricap]
deger = 0.040
birim = "m"
aralik = [0.0325, 0.050]
durum = "tahmini"
kaynak = "Mühendislik tahmini: hobi robot tekerleri yaygın olarak Ø65–Ø100 mm; nominal Ø80 mm seçildi."
sorumlu = "Mete Özgen"

[teker.kutle]
deger = 0.060
birim = "kg"
aralik = [0.030, 0.120]
durum = "tahmini"
kaynak = "Mühendislik tahmini: kauçuk lastik + göbek + kaplin, teker başına 30–120 g."
sorumlu = "Mete Özgen"

[teker.atalet_katsayisi]
deger = 0.5
birim = "-"
aralik = [0.5, 0.9]
durum = "tahmini"
kaynak = "J_w = k·m_w·r². Dolu disk için k = 0,5; kütlesi lastikte toplanan tekerde k 1'e yaklaşır."

[teker.genislik]
deger = 0.025
birim = "m"
aralik = [0.015, 0.040]
durum = "tahmini"
kaynak = "Mühendislik tahmini (yalnız çizim için)."

[teker.iz_genisligi]
deger = 0.20
birim = "m"
aralik = [0.15, 0.25]
durum = "tahmini"
kaynak = "Mühendislik tahmini: iki teker merkezi arası = şasi genişliği (~0,16 m) + motor/göbek payı."
sorumlu = "Mete Özgen"

# -----------------------------------------------------------------------------
# Motor dinamiği (motor seçilmedi, iki değer bilinmiyor; nominal = ihmal)
# -----------------------------------------------------------------------------
[motor.rotor_ataleti_yansimis]
deger = 0.0
birim = "kg*m^2"
aralik = [0.0, 0.0025]
durum = "tahmini"
kaynak = "Bilinmiyor, nominalde ihmal edildi. Teker miline yansıyan değer J_rotor·N². Veri sayfasında varsa oradan alınacak, yoksa serbest yavaşlama (coast-down) deneyiyle tanılanacak. Aralığın üst sınırı kaba tahmin [doğrulanamadı]."
sorumlu = "Mete Özgen (veri sayfası), Sefa (tanılama)"

[motor.viskoz_surtunme]
deger = 0.0
birim = "N*m*s/rad"
aralik = [0.0, 0.02]
durum = "tahmini"
kaynak = "Bilinmiyor, nominalde ihmal edildi. Teker–gövde arası redüktör viskoz sürtünmesi; motor seçilince tanılanacak. Aralık kaba tahmin [doğrulanamadı]."

# -----------------------------------------------------------------------------
# Batarya (Mete'nin seçimi bekleniyor)
# -----------------------------------------------------------------------------
[batarya.seri_hucre]
deger = 3
birim = "-"
aralik = [3, 6]
durum = "tahmini"
kaynak = "Varsayım: 3S Li-ion. Şartname §4.1 ana besleme ≤ 24 V DC. Mete'nin seçimi bekleniyor."
sorumlu = "Mete Özgen"

[batarya.hucre_gerilimi_min]
deger = 3.0
birim = "V"
aralik = [2.5, 3.3]
durum = "tahmini"
kaynak = "Li-ion hücre boşalma sonu (tipik ~3,0 V); gerçek değeri BMS kesim eşiği belirler."
sorumlu = "Mete Özgen"

[batarya.hucre_gerilimi_nominal]
deger = 3.6
birim = "V"
aralik = [3.6, 3.7]
durum = "tahmini"
kaynak = "Li-ion hücre nominal gerilimi (3,6–3,7 V)."

[batarya.hucre_gerilimi_max]
deger = 4.2
birim = "V"
aralik = [4.1, 4.2]
durum = "tahmini"
kaynak = "Li-ion hücre tam dolu gerilimi (4,2 V)."

# -----------------------------------------------------------------------------
# Gövde bileşenleri: kütle bütçesi ve yerleşim (hepsi tahmini)
